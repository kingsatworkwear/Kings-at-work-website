<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Kings at Work | Premium Workwear</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
background:#050505;
font-family:Arial,Helvetica,sans-serif;
color:white;
}

.hero{

min-height:100vh;

display:flex;

flex-direction:column;

justify-content:center;

align-items:center;

padding:40px;

text-align:center;

}

.hero img{

max-width:650px;

width:90%;

margin-bottom:40px;

animation:fadeIn 1.4s ease;

}

h1{

font-size:58px;

letter-spacing:3px;

margin-bottom:20px;

}

p{

font-size:22px;

color:#cccccc;

max-width:800px;

line-height:1.6;

margin-bottom:40px;

}

.button{

display:inline-block;

padding:18px 45px;

background:#d4af37;

color:black;

text-decoration:none;

font-weight:bold;

font-size:18px;

border-radius:8px;

transition:.3s;

}

.button:hover{

background:white;

}

@keyframes fadeIn{

from{

opacity:0;

transform:translateY(30px);

}

to{

opacity:1;

transform:translateY(0);

}

}

</style>

</head>

<body>

<section class="hero">

<img src="images/logo.png" alt="Kings at Work Logo">

<h1>BUILT BY KINGS.<br>MADE FOR LEGENDS.</h1>

<p>

Premium workwear designed for professionals who demand
quality, durability and style.

</p>

<a href="#" class="button">COMING SOON</a>

</section>

</body>

</html>
